<!doctype html>
<html lang="ro" data-t="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ text }}</title>
<style>
html{color-scheme:light;background:#fff;color:#555B66}
[data-t=dark]{color-scheme:dark;background:#1A1A1A;color:#B5B5B5}
body{margin:0;padding:48px 20px;text-align:center;font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif}
</style>
</head>
<body><p>{{ text }}</p>
<script>(function(){var m={type:'rc-form',event:'ready',slug:'',step:0,height:document.documentElement.scrollHeight};
try{if(window.parent!==window)window.parent.postMessage(m,'*')}catch(e){}
try{if(window.RadioCrestinForm)window.RadioCrestinForm.postMessage(JSON.stringify(m))}catch(e){}})();</script>
</body>
</html>
